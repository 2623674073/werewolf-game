[project]
name = "werewolf-game"
version = "0.1.0"
description = "Production-ready AgentScope werewolf game service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentscope==2.0.4",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "mcp>=1.28,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
werewolf-server = "werewolf_game.cli:server_main"
werewolf-game = "werewolf_game.cli:game_main"
werewolf-moderation-mcp = "werewolf_game.mcp.moderation_server:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_game"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["werewolf_game"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["werewolf_game"]
branch = true
