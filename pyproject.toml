[project]
name = "werewolf-game"
version = "0.3.0"
description = "Production-oriented, event-driven multi-agent werewolf game"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "2623674073" }]
keywords = ["agentscope", "multi-agent", "fastapi", "sse", "mcp", "werewolf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "agentscope==2.0.4.post1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=1.28,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.7,<3",
    "prometheus-client>=0.22,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.urls]
Homepage = "https://github.com/2623674073/werewolf-game"
Repository = "https://github.com/2623674073/werewolf-game.git"
Issues = "https://github.com/2623674073/werewolf-game/issues"
Changelog = "https://github.com/2623674073/werewolf-game/blob/main/CHANGELOG.md"

[project.scripts]
werewolf-server = "werewolf_game.cli:server_main"
werewolf-game = "werewolf_game.cli:game_main"
werewolf-historian-mcp = "werewolf_game.mcp.historian_server:main"

[dependency-groups]
dev = [
    "mypy>=1.14,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/werewolf_game"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls an explicitly configured external model service"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["werewolf_game"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["werewolf_game"]
branch = true
